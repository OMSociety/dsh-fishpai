.fp-root{
  display:flex;flex-direction:column;height:100%;min-height:0;
  color:var(--dsw-alias-label-primary);
  background:var(--dsw-alias-bg-base);
  font-size:12px;line-height:1.6;
}
.fp-root *{box-sizing:border-box}
.fp-btn{
  font:inherit;color:var(--dsw-alias-label-secondary);background:transparent;
  border:1px solid transparent;border-radius:6px;padding:2px 7px;cursor:pointer;
  transition:color .15s ease,background-color .15s ease,border-color .15s ease;
  white-space:nowrap;
}
.fp-btn:hover{color:var(--dsw-alias-label-primary);background:var(--dsw-alias-bg-layer-2)}
.fp-btn[data-on="true"]{
  color:var(--dsw-alias-label-primary);
  background:var(--dsw-alias-bg-layer-2);
  border-color:var(--dsw-alias-border-l2);
}
.fp-btn[disabled]{opacity:.5;cursor:default}
/* 置灰的开关不该在悬停时又"亮"起来——那会让人以为还能点 */
.fp-btn[disabled]:hover{color:var(--dsw-alias-label-secondary);background:transparent}
.fp-btn-primary{
  color:var(--dsw-alias-label-primary);
  background:var(--dsw-alias-bg-layer-2);
  border-color:var(--dsw-alias-border-l2);
}
.fp-btn-primary:hover{background:var(--dsw-alias-bg-layer-1)}
/* 独立操作共用表面与边框；键盘焦点使用独立轮廓。 */
.fp-btn:focus{outline:none}
.fp-btn:focus-visible{outline:2px solid var(--dsw-alias-brand-primary);outline-offset:2px}
.fp-seg{display:inline-flex;gap:1px;padding:1px;border-radius:7px;background:var(--dsw-alias-bg-layer-2);border:1px solid var(--dsw-alias-border-l2)}
.fp-seg .fp-btn{border-radius:5px;padding:2px 8px}
.fp-seg .fp-btn[data-on="true"]{background:var(--dsw-alias-bg-layer-1);border-color:var(--dsw-alias-border-l1)}

.fp-toolbar{display:flex;flex-direction:column;gap:4px;padding:6px 8px;border-bottom:1px solid var(--dsw-alias-border-l2);flex:none}
.fp-row{display:flex;align-items:center;gap:4px;flex-wrap:wrap;min-width:0}
.fp-row .fp-spacer{flex:1 1 auto}
/* 两组控件各自保持完整；空间不足时，交付动作组整体换到下一行。 */
.fp-mode-controls,.fp-actions{display:inline-flex;align-items:center;gap:4px;flex:none;flex-wrap:nowrap;white-space:nowrap}
.fp-actions{margin-left:auto}
.fp-row .fp-btn-primary{min-height:26px}
.fp-icon-btn{display:inline-flex;align-items:center;justify-content:center;width:26px;min-height:26px;padding:0;flex:none}
/* 面板窄的时候收紧一点：让主操作组尽量留在第一行 */
.fp-root[data-narrow="true"] .fp-toolbar{padding:6px 6px;gap:3px}
.fp-root[data-narrow="true"] .fp-row{gap:3px}
.fp-root[data-narrow="true"] .fp-mode-controls,.fp-root[data-narrow="true"] .fp-actions{gap:3px}
.fp-root[data-narrow="true"] .fp-btn{padding:2px 5px}
.fp-select{
  font:inherit;color:var(--dsw-alias-label-primary);background:var(--dsw-alias-bg-layer-2);
  border:1px solid var(--dsw-alias-border-l2);border-radius:6px;padding:2px 4px;max-width:11em;
}

/* 主题选择器：自绘 listbox（原生 <option> 放不进图标）。图标全走 currentColor，
   所以浅色/深色主题共用一套，不需要换图。 */
.fp-picker{position:relative;display:inline-flex}
.fp-picker-btn{
  font:inherit;display:inline-flex;align-items:center;gap:5px;max-width:12em;cursor:pointer;
  color:var(--dsw-alias-label-primary);background:var(--dsw-alias-bg-layer-2);
  border:1px solid var(--dsw-alias-border-l2);border-radius:6px;padding:2px 6px;
}
.fp-picker-btn:hover{background:var(--dsw-alias-bg-layer-2)}
.fp-picker-glyph{flex:none;color:var(--dsw-alias-label-secondary)}
.fp-picker-label{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fp-picker-caret{flex:none;color:var(--dsw-alias-label-secondary)}
.fp-menu{
  position:absolute;top:calc(100% + 4px);left:0;z-index:40;min-width:12em;
  max-height:min(60vh,340px);overflow:auto;padding:4px;
  border:1px solid var(--dsw-alias-border-l2);border-radius:8px;
  background:var(--dsw-alias-bg-overlay);box-shadow:var(--dsw-shadow-lv3,0 4px 14px rgba(0,0,0,.28));
}
/* 分组标题：组名一行、小字提示一行（挤成一行在窄面板里会折得很难看） */
.fp-menu-group{
  position:relative;
  display:flex;flex-direction:column;gap:1px;
  padding:6px 6px 3px;font-size:11px;line-height:1.45;color:var(--dsw-alias-label-secondary);
}
.fp-menu-group-title{font-weight:500}
.fp-menu-group-note{font-size:10px;color:var(--dsw-alias-label-secondary);opacity:.8}
/* 命名主题在各自行内删除，选择主题与删除是两个并列按钮。 */
.fp-menu-item{display:flex;align-items:center;gap:2px;min-width:0}
.fp-menu-item .fp-menu-row{flex:1 1 auto;min-width:0;width:auto}
.fp-menu-x{
  flex:none;font:inherit;font-size:12px;line-height:1;
  padding:3px 5px;cursor:pointer;color:var(--dsw-alias-label-secondary);
  background:transparent;border:0;border-radius:4px;
}
.fp-menu-x:hover{color:var(--dsw-alias-state-warn-primary);background:var(--dsw-alias-bg-layer-2)}
.fp-menu-scope{
  flex:none;padding:0 3px;border-radius:4px;font-size:10px;line-height:1.6;
  color:var(--dsw-alias-label-secondary);background:var(--dsw-alias-bg-layer-2);
}
/* 第二组之前来一条细分隔线：一眼能看出"上面是能直接用的，下面是另一类" */
.fp-menu-group[data-risk="true"]{
  margin-top:5px;padding-top:7px;border-top:1px solid var(--dsw-alias-border-l2);
}
.fp-menu-group[data-risk="true"] .fp-menu-group-note{color:var(--dsw-alias-state-warn-primary);opacity:1}
.fp-menu-row{
  display:flex;align-items:center;gap:6px;width:100%;text-align:left;font:inherit;cursor:pointer;
  padding:3px 6px;border-radius:5px;border:0;background:transparent;color:var(--dsw-alias-label-primary);
}
.fp-menu-row[data-active="true"]{background:var(--dsw-alias-bg-layer-2)}
.fp-menu-row[data-on="true"]{font-weight:500}
.fp-menu-glyph{flex:none;color:var(--dsw-alias-label-secondary)}
.fp-menu-name{flex:1 1 auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fp-menu-tick{flex:none;color:var(--dsw-alias-label-primary)}

/* tab chip 里的标题：图标 + 文字 */
.fp-title-label{display:inline-flex;align-items:center;gap:5px}
.fp-title-glyph{flex:none;color:var(--dsw-alias-label-secondary)}

.fp-swatches{display:flex;gap:3px;align-items:center}
.fp-swatch{
  width:14px;height:14px;border-radius:50%;border:1px solid var(--dsw-alias-border-l2);cursor:pointer;padding:0;
}
.fp-swatch[data-on="true"]{outline:2px solid var(--dsw-alias-label-primary);outline-offset:1px}
.fp-color{width:22px;height:18px;padding:0;border:1px solid var(--dsw-alias-border-l2);border-radius:4px;background:transparent;cursor:pointer}

.fp-main{display:flex;flex:1 1 auto;min-height:0;min-width:0}
.fp-main[data-layout="stack"]{flex-direction:column}
.fp-main[data-layout="side"]{flex-direction:row}
.fp-pane{display:flex;flex-direction:column;min-width:0;min-height:0;flex:1 1 50%}
.fp-pane + .fp-pane{border-top:1px solid var(--dsw-alias-border-l2)}
.fp-main[data-layout="side"] .fp-pane + .fp-pane{border-top:0;border-left:1px solid var(--dsw-alias-border-l2)}
.fp-pane-head{
  display:flex;align-items:center;gap:6px;padding:3px 8px;flex:none;
  color:var(--dsw-alias-label-secondary);font-size:11px;border-bottom:1px solid var(--dsw-alias-border-l2);
  /* 速查表浮层挂在这一整行上（不是挂那个小按钮）：这样它的百分比宽度有"面板宽度"可依，
     窄面板里才会跟着收缩，而不是定宽溢出被裁。 */
  position:relative;
}
.fp-editor{
  flex:1 1 auto;min-height:0;width:100%;resize:none;border:0;outline:none;
  padding:10px 12px;font-family:var(--ds-font-family-code,ui-monospace,SFMono-Regular,Consolas,monospace);
  font-size:12.5px;line-height:1.75;color:var(--dsw-alias-label-primary);background:var(--dsw-alias-bg-base);
  tab-size:2;
}
.fp-preview-wrap{flex:1 1 auto;min-height:0;overflow:hidden;background:var(--dsw-alias-bg-base);display:flex;justify-content:center}
.fp-preview{width:375px;max-width:100%;height:100%;border:0;background:#fff}
.fp-preview-empty{color:var(--dsw-alias-label-secondary);padding:16px;text-align:center}

.fp-drawer{flex:none;border-top:1px solid var(--dsw-alias-border-l2);display:flex;flex-direction:column;max-height:46%;min-height:0}
.fp-drawer-bar{display:flex;align-items:center;gap:4px;padding:2px 6px;min-height:30px;flex:none}
.fp-drawer[data-open="true"] .fp-drawer-bar{border-bottom:1px solid var(--dsw-alias-border-l2)}
.fp-drawer-tabs{display:flex;align-items:center;gap:1px;flex:0 1 auto;min-width:0;overflow-x:auto;scrollbar-width:none}
.fp-drawer-tabs::-webkit-scrollbar{display:none}
.fp-drawer-tabs .fp-btn{padding:2px 5px}
.fp-status{display:flex;align-items:center;justify-content:flex-end;gap:7px;min-width:0;margin-left:auto;font-size:11px;color:var(--dsw-alias-label-secondary);white-space:nowrap;flex:none}
.fp-root[data-narrow="true"] .fp-status{gap:4px}
.fp-drawer-body{overflow:auto;padding:6px 8px;min-height:0;border-top:0}
.fp-empty{color:var(--dsw-alias-label-secondary);padding:8px 2px}
.fp-item{
  border:1px solid var(--dsw-alias-border-l2);background:var(--dsw-alias-bg-layer-2);
  border-radius:7px;padding:6px 8px;margin-bottom:6px;
}
.fp-item[data-orphan="true"]{border-color:var(--dsw-alias-state-warn-primary)}
.fp-item-head{display:flex;align-items:baseline;gap:6px;font-size:11px;color:var(--dsw-alias-label-secondary)}
.fp-item-head .fp-spacer{flex:1 1 auto}
.fp-item-text{margin-top:2px;white-space:pre-wrap;word-break:break-word}
.fp-quote{margin-top:3px;font-size:11px;color:var(--dsw-alias-label-secondary);border-left:2px solid var(--dsw-alias-border-l1);padding-left:6px}
.fp-compose{display:flex;flex-direction:column;gap:4px;margin-bottom:6px}
.fp-compose textarea{
  width:100%;min-height:48px;resize:vertical;font:inherit;padding:5px 7px;border-radius:6px;
  border:1px solid var(--dsw-alias-border-l2);background:var(--dsw-alias-bg-layer-1);color:var(--dsw-alias-label-primary);
}
.fp-banner{
  margin:6px 8px;padding:6px 8px;border-radius:7px;display:flex;gap:6px;align-items:center;flex-wrap:wrap;
  border:1px solid var(--dsw-alias-state-warn-primary);background:var(--dsw-alias-bg-layer-2);
}
.fp-banner[data-kind="error"]{border-color:var(--dsw-alias-state-error-primary)}
/* 主题风险提示：与"有未保存改动""冲突"共用同一块区域，各自一行 */
.fp-banner[data-kind="warn"]{border-color:var(--dsw-alias-state-warn-primary)}
/* 关掉风险提示的 ×：与"快捷键"按钮同一套口径（不抢视觉，但可点区域够大） */
.fp-banner-x{
  flex:none;font:inherit;font-size:13px;line-height:1;cursor:pointer;padding:2px 6px;border-radius:5px;
  border:1px solid transparent;background:transparent;color:var(--dsw-alias-label-secondary);
}
.fp-banner-x:hover{color:var(--dsw-alias-label-primary);background:var(--dsw-alias-bg-layer-2)}
.fp-banner .fp-spacer{flex:1 1 auto}
.fp-toast{
  position:absolute;left:8px;right:8px;bottom:34px;padding:5px 9px;border-radius:7px;font-size:11px;
  background:var(--dsw-alias-bg-layer-2);border:1px solid var(--dsw-alias-border-l2);
  color:var(--dsw-alias-label-primary);box-shadow:var(--dsw-shadow-lv3,0 2px 8px rgba(0,0,0,.18));
}
/* 失败提示要一眼分得出来：成功与失败的文案不同、停留时间也不同（5s / 2.6s），
   再给一层颜色，用户才不会把"复制失败"看成"已复制" */
.fp-toast[data-kind="error"]{border-color:var(--dsw-alias-state-error-primary);color:var(--dsw-alias-state-error-primary)}

/* 没有文档时的空白页：一张居中的卡片。空面板只有一行小字飘在中间，既看不出是什么、
   也看不出下一步能做什么——所以三种状态（载入中 / 载入失败 / 还没有文档）共用这张卡。 */
.fp-blank{flex:1 1 auto;min-height:0;overflow:auto;display:flex;align-items:center;justify-content:center;padding:16px}
.fp-blank-card{
  width:100%;max-width:400px;display:flex;flex-direction:column;gap:10px;
  padding:14px 16px;border-radius:10px;
  border:1px solid var(--dsw-alias-border-l2);background:var(--dsw-alias-bg-layer-2);
}
.fp-blank-mark{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--dsw-alias-label-primary)}
/* 品牌标：鱼形图标放在一块小方瓦里。标自带渐变（与侧边栏、插件列表磁贴同一份图），
   方瓦的底色与描边只用令牌，深浅色通吃 */
.fp-blank-glyph{
  width:26px;height:26px;border-radius:8px;display:flex;align-items:center;justify-content:center;
  background:var(--dsw-alias-bg-layer-1);border:1px solid var(--dsw-alias-border-l2);
  color:var(--dsw-alias-label-primary);
}
.fp-blank-line{font-size:12px;line-height:1.7;color:var(--dsw-alias-label-primary)}
.fp-blank-line code{
  font-family:var(--ds-font-family-code,ui-monospace,SFMono-Regular,Consolas,monospace);
  background:var(--dsw-alias-bg-layer-1);border-radius:4px;padding:0 4px;
}
.fp-blank-actions{display:flex;gap:6px;align-items:center}
.fp-loading-bar{
  height:2px;border-radius:2px;overflow:hidden;background:var(--dsw-alias-bg-layer-1);position:relative;
}
.fp-loading-bar::after{
  content:"";position:absolute;top:0;bottom:0;width:40%;border-radius:2px;
  background:var(--dsw-alias-label-secondary);opacity:.5;
  animation:fp-sweep 1.2s ease-in-out infinite;
}
@keyframes fp-sweep{
  0%{left:-40%}
  100%{left:100%}
}
.fp-doclist{display:flex;flex-direction:column;gap:1px;border-top:1px solid var(--dsw-alias-border-l2);padding-top:8px}
.fp-doclist-head{font-size:11px;color:var(--dsw-alias-label-secondary);padding:0 6px 2px}
.fp-docrow{
  display:flex;align-items:baseline;gap:8px;width:100%;text-align:left;font:inherit;cursor:pointer;
  padding:4px 6px;border-radius:6px;border:1px solid transparent;background:transparent;
  color:var(--dsw-alias-label-primary);
}
.fp-docrow:hover{background:var(--dsw-alias-bg-layer-2);border-color:var(--dsw-alias-border-l2)}
.fp-docrow-title{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fp-docrow .fp-spacer{flex:1 1 auto}
.fp-root{position:relative}
.fp-muted{color:var(--dsw-alias-label-secondary)}
.fp-warn{color:var(--dsw-alias-state-warn-primary)}

/* 快捷键速查表：挂在编辑器头上的小按钮 + 一块列表（内容和键盘处理同源） */
/* 注意是 static：浮层的定位上下文交给 .fp-pane-head（整行），见那里的注释。
   （这里是模板字符串里，注释别用反引号——会把字符串闭合掉。） */
.fp-keys-wrap{display:inline-flex;flex:none}
.fp-keys-btn{
  font:inherit;font-size:11px;line-height:1;cursor:pointer;padding:3px 6px;border-radius:5px;
  border:1px solid var(--dsw-alias-border-l2);background:transparent;color:var(--dsw-alias-label-secondary);
}
.fp-keys-btn:hover{color:var(--dsw-alias-label-primary);background:var(--dsw-alias-bg-layer-2)}
.fp-keys-btn[data-on="true"]{color:var(--dsw-alias-label-primary);background:var(--dsw-alias-bg-layer-2)}
.fp-keys{
  position:absolute;top:calc(100% + 4px);right:0;z-index:3;
  /* 宽度随面板收缩；max-width 留出 12px 余量，完整显示标签与键帽。 */
  width:auto;min-width:min(232px,100%);max-width:calc(100% - 12px);
  max-height:60vh;overflow:auto;
  padding:6px;border-radius:8px;border:1px solid var(--dsw-alias-border-l2);
  background:var(--dsw-alias-bg-overlay);box-shadow:0 8px 24px rgba(0,0,0,.18);
  color:var(--dsw-alias-label-primary);font-size:11.5px;line-height:1.9;text-align:left;
}
.fp-keys-group{padding:2px 4px;color:var(--dsw-alias-label-secondary);font-size:11px}
.fp-keys-row{display:flex;align-items:baseline;gap:8px;padding:0 4px;min-width:0}
/* 标签列要能被压窄（中文按字换行），键帽保持一行不折 */
.fp-keys-row > span:first-child{flex:0 1 auto;min-width:0}
.fp-keys-row .fp-spacer{flex:1 1 auto;min-width:0}
.fp-keys-note{
  margin-top:4px;padding:5px 4px 1px;border-top:1px solid var(--dsw-alias-border-l2);
  color:var(--dsw-alias-label-secondary);line-height:1.75;
}
.fp-kbd{
  flex:none;font-family:var(--ds-font-family-code,ui-monospace,SFMono-Regular,Consolas,monospace);
  font-size:10.5px;padding:1px 5px;border-radius:4px;white-space:nowrap;
  border:1px solid var(--dsw-alias-border-l2);background:var(--dsw-alias-bg-layer-2);color:var(--dsw-alias-label-primary);
}

/* 专业组件插入浮层：定位上下文与快捷键一样，都是编辑器工具行。 */
.fp-components{display:inline-flex;flex:none}
.fp-component-popover{
  position:absolute;top:calc(100% + 4px);right:0;z-index:4;width:320px;max-width:calc(100% - 12px);
  max-height:60vh;overflow:auto;padding:8px;border-radius:8px;
  border:1px solid var(--dsw-alias-border-l2);background:var(--dsw-alias-bg-overlay);box-shadow:var(--dsw-shadow-lv2);
  color:var(--dsw-alias-label-primary);
}
.fp-component-title{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap;padding:0 2px 7px;font-size:11.5px}
.fp-component-title .fp-muted{font-size:10.5px}
.fp-component-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.fp-component-item{
  display:flex;align-items:flex-start;gap:6px;min-width:0;padding:6px;text-align:left;font:inherit;cursor:pointer;
  border:1px solid var(--dsw-alias-border-l2);border-radius:7px;background:transparent;color:var(--dsw-alias-label-primary);
}
.fp-component-item:hover{background:var(--dsw-alias-bg-layer-2);border-color:var(--dsw-alias-border-l1)}
.fp-component-thumb{
  display:grid;place-items:center;flex:none;width:26px;height:26px;border-radius:6px;
  background:var(--dsw-alias-bg-layer-2);color:var(--dsw-alias-label-primary);font-size:15px;line-height:1;
}
.fp-component-copy{display:flex;flex-direction:column;gap:2px;min-width:0}
.fp-component-name{font-size:11.5px;line-height:1.4}
.fp-component-description{color:var(--dsw-alias-label-secondary);font-size:10.5px;line-height:1.45}
.fp-root[data-narrow="true"] .fp-component-list{grid-template-columns:1fr}

.fp-input{
  width:100%;min-width:0;font:inherit;color:var(--dsw-alias-label-primary);background:var(--dsw-alias-bg-base);
  border:1px solid var(--dsw-alias-border-l2);border-radius:6px;padding:6px 8px;outline:none;
}
.fp-input:focus{border-color:var(--dsw-alias-brand-primary);box-shadow:0 0 0 2px var(--dsw-alias-bg-layer-2)}
.fp-input[disabled]{opacity:.6}

/* 页头页尾片段库。 */
.fp-btn.danger{color:var(--dsw-alias-state-error-primary)}
.fp-item-title{font-weight:500;color:var(--dsw-alias-label-primary);word-break:break-word}
.fp-item-meta{margin-top:2px;font-size:11px;color:var(--dsw-alias-label-secondary);word-break:break-word}
.fp-item-actions{display:flex;align-items:center;gap:4px;flex-wrap:wrap;margin-top:6px}
.fp-item details{margin-top:5px;color:var(--dsw-alias-label-secondary)}
.fp-item summary{cursor:pointer}
.fp-compose textarea.fp-library-source{min-height:84px;resize:vertical}
.fp-library-error{padding:4px 2px;color:var(--dsw-alias-state-error-primary);word-break:break-word}
.fp-library-status{padding:8px 2px;color:var(--dsw-alias-label-secondary)}
.fp-library-pending{
  display:flex;flex-direction:column;gap:5px;margin:6px 0;padding:8px;border-radius:7px;
  border:1px solid var(--dsw-alias-border-l1);background:var(--dsw-alias-bg-layer-2);
}
.fp-library-list{margin-top:6px}
.fp-snippet-html{
  max-height:140px;overflow:auto;margin:5px 0 0;padding:6px;border-radius:5px;white-space:pre-wrap;word-break:break-all;
  border:1px solid var(--dsw-alias-border-l2);background:var(--dsw-alias-bg-layer-1);color:var(--dsw-alias-label-primary);
  font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:10px;
}
.fp-banner-copy{min-width:0;flex:1 1 auto}

# 把内容，排成作品\r
\r
好的排版先建立秩序，再表达个性。**观点、素材与阅读节奏**，都应该有清楚的位置。\r
\r
鱼排把文稿、自由画布和复制放进同一个工作台：写作者专注于内容，工具负责把结构完整地带到公众号。\r

一份文稿，承载完整的编辑过程\r
:::\r
\r
写作、批注与修改都落在同一份 Markdown 上。正文保持可编辑，组件负责重复结构，独特画面则在自由画布中完成。\r

自由画布不是装饰的堆叠\r

:::\r

---\r
**主视觉**建立主题，**章节头**划分阅读节奏，**信息卡**收拢时间与地点，**展开组件**承载补充细节。每一层都服务于阅读目标。\r
:::\r

# 把内容，排成作品\r
\r
好的排版先建立秩序，再表达个性。**观点、素材与阅读节奏**，都应该有清楚的位置。\r
\r
鱼排把文稿、自由画布和复制放进同一个工作台：写作者专注于内容，工具负责把结构完整地带到公众号。\r

:::\r
\r

一份文稿，承载完整的编辑过程\r
:::\r
\r
写作、批注与修改都落在同一份 Markdown 上。正文保持可编辑，组件负责重复结构，独特画面则在自由画布中完成。\r
\r

:::\r
\r
:::chapter_header\r
02\r
让视觉服务内容\r
自由画布不是装饰的堆叠\r
而是信息的另一种组织方式\r
:::\r
\r
:::raw\r
<section style="margin:22px 0 14px;">\r
  <section style="width:90%;padding:18px;box-sizing:border-box;background-color:#17213a;color:#ffffff;">\r

    <p style="margin:8px 0 0;font-size:19px;line-height:1.55;font-weight:700;">什么时候需要自由画布？</p>\r

    <p style="margin:8px 0 0;font-size:15px;line-height:1.85;color:#344054;">当素材、层级或交互本身就是内容的一部分。照片、标识、艺术字与 SVG 可以自由组合，正文依然保持清晰。</p>\r
  </section>\r

\r
:::expand\r
展开看看：一篇专题稿如何被组织\r
---\r
**主视觉**建立主题，**章节头**划分阅读节奏，**信息卡**收拢时间与地点，**展开组件**承载补充细节。每一层都服务于阅读目标。\r
:::\r
\r
:::chapter_header\r
03\r
从画布到剪贴板\r
同一份文稿，交给下一个编辑场景\r
:::\r
\r
鱼排把同一份文稿渲染为内联样式 HTML，复制到剪贴板后即可带入目标编辑器。工具处理结构，作者把精力留给内容与视觉判断。\r

  <tr>

    </td>
    <td style="vertical-align:top;padding:14px 0 12px 12px;border:0;border-top:2px solid #17213a;">
      <p style="margin:0;font-size:24px;line-height:1.2;font-weight:700;color:#2f4fc1;">03</p>

</table><section style="margin:34px 0 22px;text-align:center;"><p style="margin:0;font-size:0;line-height:0;"><span style="display:inline-block;vertical-align:middle;padding:3px 12px;background-color:#2f4fc1;color:#ffffff;font-size:28px;line-height:1.25;font-weight:800;letter-spacing:1px;">01</span><span style="display:inline-block;vertical-align:middle;padding:7px 12px;background-color:#17213a;color:#ffffff;font-size:24px;line-height:1.45;font-weight:700;letter-spacing:2px;">先建立秩序</span></p><p style="margin:9px 0 0;color:#667085;font-size:13px;line-height:1.6;letter-spacing:1px;text-align:center;white-space:pre-line;">一份文稿，承载完整的编辑过程</p></section><p style="margin:0 0 14px;color:#344054;font-size:15px;line-height:1.85;text-align:left;">写作、批注与修改都落在同一份 Markdown 上。正文保持可编辑，组件负责重复结构，独特画面则在自由画布中完成。</p><section style="width:90%;margin:24px auto;background-color:#ffffff;border-radius:0px;box-shadow:0 3px 3px rgba(0,0,0,0.08);overflow:hidden;"><p style="margin:0;padding:12px 20px;background-color:#2f4fc1;color:#ffffff;font-size:20px;line-height:1.5;font-weight:700;letter-spacing:1px;">一份文稿，三种输出</p><section style="padding:18px 20px 6px;"><p style="margin:0 0 14px;color:#344054;font-size:15px;line-height:1.85;text-align:left;">预览用于阅读确认，复制到剪贴板用于粘贴，导出 HTML 用于归档与进一步加工。</p></section></section><section style="margin:24px 0 12px;padding:10px 8px 12px;background-color:#ffffff;border:1px solid #e2e5ec;line-height:0;">

</section><section style="margin:18px 0;text-align:left;"><span style="display:inline-block;max-width:100%;box-sizing:border-box;padding:6px 12px;background-color:#2f4fc1;color:#ffffff;font-size:15px;line-height:1.5;font-weight:700;letter-spacing:0.6px;"><strong style="color:#ffffff;font-weight:700;">写作、预览与复制，共享同一份内容</strong></span></section><section style="margin:34px 0 22px;text-align:center;"><p style="margin:0;font-size:0;line-height:0;"><span style="display:inline-block;vertical-align:middle;padding:3px 12px;background-color:#2f4fc1;color:#ffffff;font-size:28px;line-height:1.25;font-weight:800;letter-spacing:1px;">02</span><span style="display:inline-block;vertical-align:middle;padding:7px 12px;background-color:#17213a;color:#ffffff;font-size:24px;line-height:1.45;font-weight:700;letter-spacing:2px;">让视觉服务内容</span></p><p style="margin:9px 0 0;color:#667085;font-size:13px;line-height:1.6;letter-spacing:1px;text-align:center;white-space:pre-line;">自由画布不是装饰的堆叠
而是信息的另一种组织方式</p></section><section style="margin:22px 0 14px;">
  <section style="width:90%;padding:18px;box-sizing:border-box;background-color:#17213a;color:#ffffff;">
    <p style="margin:0;font-size:12px;line-height:1.5;letter-spacing:2px;color:#b8c7f5;">QUESTION</p>
    <p style="margin:8px 0 0;font-size:19px;line-height:1.55;font-weight:700;">什么时候需要自由画布？</p>
  </section>
  <section style="width:90%;margin:12px 0 0 auto;padding:18px;box-sizing:border-box;background-color:#ffffff;border:1px solid #dfe3ea;">
    <p style="margin:0;font-size:12px;line-height:1.5;letter-spacing:2px;color:#2f4fc1;">ANSWER</p>
    <p style="margin:8px 0 0;font-size:15px;line-height:1.85;color:#344054;">当素材、层级或交互本身就是内容的一部分。照片、标识、艺术字与 SVG 可以自由组合，正文依然保持清晰。</p>
  </section>
</section><section style="margin:0 0 20px;overflow:hidden;line-height:0;"><section style="height:0;min-height:0;overflow:visible;display:flow-root;"><section style="margin-top:56px;padding:16px 16px 14px;box-sizing:border-box;background-color:#ffffff;border-top:1px solid #f6f5f2;border-radius:0px;color:#344054;font-size:15px;line-height:1.85;"><p style="margin:0 0 0px;color:#344054;font-size:15px;line-height:1.85;text-align:left;"><strong style="color:#17213a;font-weight:700;white-space:nowrap;">主视觉</strong>建立主题，<strong style="color:#17213a;font-weight:700;white-space:nowrap;">章节头</strong>划分阅读节奏，<strong style="color:#17213a;font-weight:700;white-space:nowrap;">信息卡</strong>收拢时间与地点，<strong style="color:#17213a;font-weight:700;white-space:nowrap;">展开组件</strong>承载补充细节。每一层都服务于阅读目标。</p></section></section><svg xmlns="http://www.w3.org/2000/svg" width="100%" height="56" style="display:block;cursor:pointer;" role="button" aria-label="展开看看：一篇专题稿如何被组织"><rect x="0" y="0" width="100%" height="56" rx="0" fill="#ffffff"/><text x="16" y="33" fill="#17213a" font-size="15" font-weight="600">展开看看：一篇专题稿如何被组织</text><text x="96%" y="36" text-anchor="end" fill="#2f4fc1" font-size="24" font-weight="400">＋</text><animate attributeName="height" from="56" to="198" dur="0.4s" begin="click" fill="freeze"/></svg></section><section style="margin:34px 0 22px;text-align:center;"><p style="margin:0;font-size:0;line-height:0;"><span style="display:inline-block;vertical-align:middle;padding:3px 12px;background-color:#2f4fc1;color:#ffffff;font-size:28px;line-height:1.25;font-weight:800;letter-spacing:1px;">03</span><span style="display:inline-block;vertical-align:middle;padding:7px 12px;background-color:#17213a;color:#ffffff;font-size:24px;line-height:1.45;font-weight:700;letter-spacing:2px;">从画布到剪贴板</span></p><p style="margin:9px 0 0;color:#667085;font-size:13px;line-height:1.6;letter-spacing:1px;text-align:center;white-space:pre-line;">同一份文稿，交给下一个编辑场景</p></section><p style="margin:0 0 14px;color:#344054;font-size:15px;line-height:1.85;text-align:left;">鱼排把同一份文稿渲染为内联样式 HTML，复制到剪贴板后即可带入目标编辑器。工具处理结构，作者把精力留给内容与视觉判断。</p><section style="max-width:none !important;margin:0 -20px;"><section style="margin:30px 0 0;padding:30px 20px 26px;background-color:#2f4fc1;color:#ffffff;">
