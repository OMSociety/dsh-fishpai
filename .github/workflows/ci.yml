name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install dev tooling
        run: npm ci --no-audit --no-fund

      - name: Renderer golden + core unit tests
        run: npm test

      - name: Typecheck client sources
        run: npm run typecheck

      - name: Client bundle is in sync with its sources
        run: npm run check:build

      - name: 发布物清单
        run: npm run check:pack
