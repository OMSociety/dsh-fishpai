name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dev tooling
        run: npm ci --no-audit --no-fund

      - name: Renderer golden + core unit tests
        run: npm test

      - name: Typecheck client sources
        run: npm run typecheck

      - name: Client bundle is in sync with its sources
        run: npm run check:build

  release-tag:
    # 打了 v* tag 就核对"版本号、CHANGELOG、tag 三者说的是同一件事"。
    # 只做核对，不发布：npm 发布由维护者本机执行（见 dsh-plugin-creator 的发布一节），
    # 把 NPM_TOKEN 放进 Actions secrets 是另一项独立决定。
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Tag matches package.json version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "tag v$tag 与 package.json 的 $pkg 不一致" >&2
            exit 1
          fi
          echo "tag v$tag == package.json $pkg"

      - name: CHANGELOG has a section for this version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          grep -qF "## [$tag]" CHANGELOG.md || {
            echo "CHANGELOG.md 里没有 [${tag}] 一节" >&2
            exit 1
          }
          echo "CHANGELOG.md 有 [$tag]"
