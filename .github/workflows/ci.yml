name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dev tooling
        run: npm ci --no-audit --no-fund

      - name: Renderer golden + core unit tests
        run: npm test

      - name: Typecheck client sources
        run: npm run typecheck

      - name: Client bundle is in sync with its sources
        run: npm run check:build
