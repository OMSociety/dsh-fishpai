name: Feature request
description: 期望的新功能
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        提之前请先确认它不是 [AGENTS.md](https://github.com/OMSociety/dsh-fishpai/blob/main/AGENTS.md)
        里明确不做的事——那 15 条不变量写清了哪些是**有意的**取舍（上游 8 个坑不许"修好"、
        自定义主题只能是数据不能是代码、预览与发布是两条渲染路径等）。

  - type: textarea
    id: problem
    attributes:
      label: 当前项目存在哪些问题
      description: 描述使用场景与痛点
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: 你设想的新功能
      description: 如果这属于渲染或主题，请说明它落在预览侧还是发布侧。
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案与其他需要说明的内容
    validations:
      required: false
